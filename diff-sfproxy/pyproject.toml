[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfproxy-research"
version = "0.1.0"
description = "Differentiable note-wise SoundFont proxy for velocity adaptation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "data*", "features*", "models*", "renderers*", "tools*"]
